# Pages CMS configuration — https://pagescms.org/docs/configuration
media:
  input: assets/images
  output: /assets/images

content:
  - name: posts
    label: Posts
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date]
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
        default: "{{ now }}"
      - name: body
        label: Body
        type: rich-text

  - name: settings
    label: Settings
    type: file
    path: _data/settings.yml
    fields:
      - name: title
        label: Site title
        type: string
      - name: description
        label: Description
        type: text
      - name: author
        label: Author
        type: string
